name: Update and deploy dashboard

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "update-dashboard.mjs"
      - ".github/workflows/update-dashboard.yml"
  workflow_dispatch:
  schedule:
    # 18:00 Beijing time.
    - cron: "0 10 * * *"

permissions:
  contents: write

concurrency:
  group: dataflex-dashboard
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Update dashboard data
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          VERSION: ${{ github.run_number }}-${{ github.sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              echo "::warning::Missing repository secret GH_TOKEN; skipping data refresh for this push."
              exit 0
            fi
            echo "::error::Missing repository secret GH_TOKEN. Add a GitHub PAT with public_repo access so the workflow can read stargazers starred_at from OpenDCAI/DataFlex and competitor repos."
            exit 1
          fi
          node update-dashboard.mjs

      - name: Validate dashboard script
        run: node --check app.js

      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html
          if git diff --cached --quiet; then
            echo "No dashboard changes to commit."
          else
            git commit -m "chore: update dashboard snapshot"
            git push
          fi
